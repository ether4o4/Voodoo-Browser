name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build:web && node --test --test-concurrency=1 tests/*.test.cjs
      - run: npm ci --prefix bridge-server && node --test --test-concurrency=1 bridge-server/test/*.mjs
      - run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - run: python3 -m unittest discover -s tests -p "*_test.py"
      - run: python3 tools/fetch-llama-runtime.py
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Voodoo-development-and-unsigned-release
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
