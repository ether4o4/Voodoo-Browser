name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build:web && git diff --exit-code -- app/src/main/assets/globe.bundle.js && node --test --test-concurrency=1 tests/*.test.cjs
      - run: npm ci --prefix bridge-server && node --test --test-concurrency=1 bridge-server/test/*.mjs
      - run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - run: python3 -m unittest discover -s tests -p "*_test.py"
      - run: python3 tools/fetch-llama-runtime.py
      - name: Install persistent development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOODOO_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::VOODOO_DEV_KEYSTORE_BASE64 is not set; this build uses a temporary debug key and cannot be published."
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voodoo-dev.p12"
            echo "VOODOO_DEV_KEYSTORE=$RUNNER_TEMP/voodoo-dev.p12" >> "$GITHUB_ENV"
          fi
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug assembleRelease lintRelease --no-daemon
        env:
          VOODOO_DEV_KEYSTORE_PASSWORD: ${{ secrets.VOODOO_DEV_KEYSTORE_PASSWORD }}
      - run: python3 tools/verify-apks.py
      - name: Include public signing tool for local release signing
        run: |
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verification/
      - uses: actions/upload-artifact@v4
        with:
          name: Voodoo-development-and-unsigned-release
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            verification/
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
