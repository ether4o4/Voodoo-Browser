plugins { id 'com.android.application' }
android {
    namespace 'com.ether4o4.voodoo'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ether4o4.voodoo'
        minSdk 29
        targetSdk 36
        versionCode 17
        versionName '0.3.10'
    }
    // CI signs development builds with one persistent key from repository secrets, so
    // preview updates install over each other. Local builds keep Android's debug key.
    signingConfigs {
        dev {
            def keystore = System.getenv('VOODOO_DEV_KEYSTORE')
            if (keystore) {
                storeFile file(keystore); storeType 'pkcs12'; keyAlias 'voodoo-dev'
                storePassword System.getenv('VOODOO_DEV_KEYSTORE_PASSWORD'); keyPassword System.getenv('VOODOO_DEV_KEYSTORE_PASSWORD')
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev'; if (System.getenv('VOODOO_DEV_KEYSTORE')) signingConfig signingConfigs.dev }
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libvoodoo-completion.so']; excludes += ['lib/x86/libtor.so','lib/x86_64/libtor.so'] } }
    lint { abortOnError true }
}
tasks.register('verifyLocalRuntime') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libvoodoo-completion.so').exists())
            throw new GradleException('Run python3 tools/fetch-llama-runtime.py before building. Model weights are not required.')
    }
}
tasks.named('preBuild').configure { dependsOn('verifyLocalRuntime') }
tasks.withType(Test).configureEach {
    // The secret itself is never a task input or log field. A fresh fixture must run.
    if (System.getenv('VOODOO_INTEROP_CODE')) outputs.upToDateWhen { false }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'info.guardianproject:tor-android:0.4.9.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
